    <main class="gallery">


        <!-- PERSON 1 -->

        <div class="artwork"
             data-title="Inisha Khadka"
             data-artist="Photograph, 16 Sep 2026"
             data-description="Inisha has influenced me by giving me a more positive and gentle perspective on life. She has a way of looking at situations from a different point of view, which has helped me become more understanding and less negative when dealing with difficult situations. Her support and positivity have also encouraged me to appreciate the people and experiences around me more. I included her because she has had a strong influence on the way I think and approach things today, and I value having someone in my life who can always help me see things differently.">

            <img src="images/inisha.png" alt="Inisha">

            <h2>
                Inisha
            </h2>

        </div>



        <!-- PERSON 2 -->

        <div class="artwork"
             data-title="Sofia Stoici"
             data-artist="Photograph, 14 Mar 2026"
             data-description="Sofia has influenced the person I am today through the close relationship we have had since we were young. Unlike the typical relationship between siblings, we have always gotten along well and have been able to enjoy each other’s company. Her witty personality has brought a lot of humour into my life and has made growing up together more enjoyable. She has also helped me become more responsible, particularly as I have grown older and taken on more responsibility within our family. I included her because she has been a constant part of my life and has influenced me in both small and meaningful ways.">

            <img src="images/sofia.png" alt="Sofia">

            <h2>
                Sofia
            </h2>

        </div>



        <!-- PERSON 3 -->

        <div class="artwork"
             data-title="Dad"
             data-artist="Photograph, 10 May 2026"
             data-description="My dad has influenced the person I am today by teaching me to be more responsible and independent as I have grown up. He has always been someone I can learn from, whether it is through the things he has taught me directly or by watching how he handles different situations. He has encouraged me to try new things and gradually take on more responsibility for myself. Moments like learning to drive with him have shown me how much I have grown and the importance of having someone there to guide you while still allowing you to learn for yourself. I included him because he has played an important role in helping shape the person I am today.">

            <img src="images/dad.png" alt="Dad">

            <h2>
                Dad
            </h2>

        </div>



        <!-- PERSON 4 -->

        <div class="artwork"
             data-title="Mum"
             data-artist="Photograph, 29 Aug 2026"
             data-description="My mum has influenced the person I am today through the support and care she has given me throughout my life. She has always been someone I can rely on and talk to, which has helped me become more comfortable expressing myself and asking for advice when I need it. She has also taught me the importance of caring about the people around me and being there for others when they need support. Growing up with her has shaped many of the values I have today, and I included her because she has been such a constant and important part of my life.">

            <img src="images/mum.png" alt="Mum">

            <h2>
                Mum
            </h2>

        </div>



        <!-- PERSON 5 -->

        <div class="artwork"
             data-title="Daniel Thomas"
             data-artist="Photograph, 8 May 2026"
             data-description="Daniel has influenced the person I am today through how well he knows and understands me. He is someone who has been around for many important parts of my life and has seen different sides of my personality over the years. I feel like if I ever forgot who I was or what kind of person I wanted to be, Daniel would be able to remind me. Our friendship has helped me feel comfortable being myself without having to change who I am for other people. I included him because he is not only one of my closest friends, but also someone who has become an important part of how I understand myself.">

            <img src="images/dt.png" alt="Daniel">

            <h2>
                Daniel
            </h2>

        </div>



        <!-- PERSON 6 -->

        <div class="artwork"
             data-title="Kristian Maandig"
             data-artist="Photograph, 19 Jun 2026"
             data-description="Kristian has influenced the person I am today through the way he thinks deeply about things and is always there when I need someone. He is someone I can talk to about almost anything, and he often brings a different perspective that makes me think about things in ways I normally wouldn’t. His consistency and willingness to be there for the people around him has shown me the importance of being someone others can rely on. I included him because he has been a constant part of my life and friendship, and his way of thinking has influenced how I look at different situations.">

            <img src="images/kris.png" alt="Kristian">

            <h2>
                Kristian
            </h2>

        </div>



        <!-- PERSON 7 -->

        <div class="artwork"
             data-title="Luke Henderson"
             data-artist="Photograph, 28 Mar 2026"
             data-description="Luke has influenced the person I am today through his ability to stay neutral and not immediately pick a side. When disagreements happen, he is usually the person in the middle, able to understand where everyone is coming from without getting caught up in the argument himself. He has shown me that you do not always have to choose a side, especially when there are different perspectives involved. I included him because his ability to stay level-headed and see things from different points of view is something I respect and have learned from.">

            <img src="images/luke.png" alt="Luke">

            <h2>
                Luke
            </h2>

        </div>



        <!-- PERSON 8 -->

        <div class="artwork"
             data-title="Max Haubrich"
             data-artist="Photograph, 5 Jul 2026"
             data-description="Max has influenced the person I am today through his exciting and adventurous way of looking at life. We have been friends since Grade 7, making him one of the longest-lasting friendships I have. Over the years, we have shared countless experiences and memories, and having him around has made growing up a lot more enjoyable. His willingness to try new things and find humour out of different situations has encouraged me to be more open to new experiences myself. I included him because he has been a constant part of my life for years, and our friendship has had a lasting influence on who I am today.">

            <img src="images/max.png" alt="Max">

            <h2>
                Max
            </h2>

        </div>



        <!-- PERSON 9 -->

        <div class="artwork"
             data-title="Leo Donnarumma"
             data-artist="Photograph, 10 May 2026"
             data-description="Leo has influenced the person I am today through his relaxed and laidback perspective on life. He has a way of staying calm and not letting small things become bigger than they need to be. Being around him has helped me realise that not everything needs to be taken so seriously, and that it is important to slow down and enjoy the moment. His attitude has influenced the way I approach certain situations, especially when things do not go exactly as planned. I included him because his relaxed way of looking at life is something I appreciate and have learned from.">

            <img src="images/leo.png" alt="Leo">

            <h2>
                Leo
            </h2>

        </div>



        <!-- PERSON 10 -->

        <div class="artwork"
             data-title="James Bettison"
             data-artist="Photograph, 28 Aug 2026"
             data-description="James has influenced the person I am today through how loyal and supportive he is towards his friends. He is someone who will always have his friends’ backs and make sure they know they are not alone when something goes wrong. Having a friend like him has shown me the importance of being there for the people you care about, even when it is not always easy. His loyalty has made our friendship stronger and has influenced the way I try to support the people around me. I included him because he is someone I know I can rely on and who has shown me what it means to be a good friend.">

            <img src="images/james.png" alt="James">

            <h2>
                James
            </h2>

        </div>



        <!-- PERSON 11 -->

        <div class="artwork"
             data-title="Beau Gavros"
             data-artist="Photograph, 7 Feb 2026"
             data-description="Beau has influenced the person I am today through his confidence in speaking his mind and standing by his opinions. He is not afraid to say what he thinks, even when his opinion is different from everyone else’s. Being around him has shown me that it is important to have your own perspective and not be afraid to express it. He has encouraged me to be more confident in my own opinions and to understand that it is okay to disagree with other people. I included him because his confidence and willingness to speak honestly are qualities I respect and have learned from.">

            <img src="images/beau.png" alt="Beau">

            <h2>
                Beau
            </h2>

        </div>



        <!-- PERSON 12 -->

        <div class="artwork"
             data-title="Aden O'Donoghue"
             data-artist="Photograph, 27 Nov 2025"
             data-description="Aden has influenced the person I am today through his motivation and drive to keep working towards what he wants. He is someone who puts a lot of effort into the things he cares about, and his determination can motivate the people around him to do the same. Seeing how committed he can be has encouraged me to put more effort into my own goals and not give up when something becomes difficult. I included him because his attitude towards achieving what he wants is something I find inspiring, and it has influenced the way I approach my own goals.">

            <img src="images/aden.png" alt="Aden">

            <h2>
                Aden
            </h2>

        </div>



        <!-- PERSON 13 -->

        <div class="artwork"
             data-title="Brayden Silva"
             data-artist="Photograph, 2 May 2026"
             data-description="Brayden has influenced the person I am today through his down-to-earth and realistic perspective on life. He has a way of looking at situations for what they really are and reminding the people around him to stay grounded. His perspective has helped me understand that life is not always going to go exactly how I expect, and that sometimes it is important to accept things for what they are. I included him because he brings a realistic point of view to my life and reminds me to stay grounded while still enjoying the things around me.">

            <img src="images/bray.png" alt="Brayden">

            <h2>
                Brayden
            </h2>

        </div>
