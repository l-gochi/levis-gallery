    <!-- =========================
         GALLERY
         ========================= -->

    <main class="gallery">


        <!-- ARTWORK 1 -->

        <div class="artwork"
             data-title="The Instruments"
             data-artist="Artwork, 16 Aug 2026"
             data-description="This artwork drawn by me is a reference to my favourite manga series, Sakamoto Days. It features two of my favourite characters, Osaragi and Shishiba, who are wielding a hammer and a buzzsaw respectively. It also represents one of the things I enjoy in my free time. Creating artwork based on it also allows me to express my appreciation for the series through my own artistic style.">

            <img src="images/artwork1.png" alt="The Instruments">

            <h2>
                The Instruments
            </h2>

        </div>



        <!-- ARTWORK 2 -->

        <div class="artwork"
             data-title="My Maternal Family"
             data-artist="Photograph, 6 Sep 2020"
             data-description="I included my maternal family because they represent many of the memories and experiences that have shaped my upbringing. They are connected to the familiar places, traditions and moments I associated with growing up.">

            <img src="images/artwork2.png" alt="My Maternal Family">

            <h2>
                My Maternal Family
            </h2>

        </div>



        <!-- ARTWORK 3 -->

        <div class="artwork"
             data-title="Home"
             data-artist="Photograph, 8 Sep 2026"
             data-description="I included this artwork because my mum, dad and little sister are an important part of my life. They have been there throughout my upbringing and are a big part of the memories and experiences I have growing up. This artwork represents my immediate family and the role they have in my life.">

            <img src="images/artwork3.png" alt="Home">

            <h2>
                Home
            </h2>

        </div>



        <!-- ARTWORK 4 -->

        <div class="artwork"
             data-title="The Demons"
             data-artist="Photograph, 18 Sep 2026"
             data-description="A photograph of my socials volleyball team, the Daylight Demons. It consists of myself, and 7 of my friends. Daniel, Kristian, Max, Luke, James, Leo, and Beau (Not Present). We are currently first on the ladder and set to play in the finals this Friday (25 Sep). I included this image because it shows how far I have come alongside my friends when we work together to accomplish a mutual goal while still having fun.">

            <img src="images/artwork4.png" alt="The Demons">

            <h2>
                The Demons
            </h2>

        </div>



        <!-- ARTWORK 5 -->

        <div class="artwork"
             data-title="DT and I"
             data-artist="Photograph, 22 May 2026"
             data-description="This is a photo of myself (Left), and Daniel (Right). Daniel, or DT, has been my best friend since Year 8, when we were two strangers stuck on the same table in a random class, not knowing about the memories that we would make together, and how we should shape each other's identities and paths.">

            <img src="images/artwork5.png" alt="DT and I">

            <h2>
                DT and I
            </h2>

        </div>



        <!-- ARTWORK 6 -->

        <div class="artwork"
             data-title="At the Mercy of the Wind"
             data-artist="Photograph, 14 Sep 2026"
             data-description="I chose this photograph because I liked the way the weathervane stands alone against the night sky. The title, “At the Mercy of the Wind,” reflects how the weathervane is constantly changing direction depending on something outside of its control. I relate to this idea because there have been times in my life when I have not always known what direction I was going in or what was going to happen next. The weathervane represents the changes and uncertainty that come with growing up, while the night sky gives the photograph a quiet and reflective atmosphere. I wanted the artwork to represent the idea that it is okay not to always have a clear direction, as things can change over time.">

            <img src="images/artwork6.png" alt="At the Mercy of the Wind">

            <h2>
                At the Mercy of the Wind
            </h2>

        </div>



        <!-- ARTWORK 7 -->

        <div class="artwork"
             data-title="The Cold Horizon"
             data-artist="Photograph, 15 Jul 2026"
             data-description="I included this photograph because it represents me within an environment that feels very different from my everyday surroundings. The snowy ground and night sky create a quiet and isolated atmosphere, while having myself as the main subject makes the image more personal. I like the contrast between the dark sky and the bright snow, as it gives the photograph a calm but slightly mysterious feeling. I chose to include it because it shows both my interest in photography and my appreciation for unusual environments and scenery.">

            <img src="images/artwork7.png" alt="The Cold Horizon">

            <h2>
                The Cold Horizon
            </h2>

        </div>



        <!-- ARTWORK 8 -->

        <div class="artwork"
             data-title="Blue Noon"
             data-artist="Photograph, 11 Jul 2026"
             data-description="I included this photograph because I liked the way the blue fog completely changes the appearance of the trees. The fog makes it difficult to see where the trees end, creating a sense that the landscape continues much further than it actually does. I like how the photograph gives a normal environment a more unusual and mysterious atmosphere. The limited visibility also makes the image feel almost like there is something beyond what can be seen, which is what made me want to include it in my gallery.">

            <img src="images/artwork8.png" alt="Blue Noon">

            <h2>
                Blue Noon
            </h2>

        </div>



        <!-- ARTWORK 9 -->

        <div class="artwork"
             data-title="Seatbelt Master"
             data-artist="Photograph, 6 Sep 2026"
             data-description="I included this photograph because it captures the first time I drove a car, with my dad beside me. It represents an important milestone for me as I begin learning how to drive and becoming more independent. Having my dad there made the experience more meaningful, as he was able to guide me and help me throughout the drive. I wanted to include this photograph because it captures a moment that I will remember as the beginning of my experience with driving.">

            <img src="images/artwork9.png" alt="Seatbelt Master">

            <h2>
                Seatbelt Master
            </h2>

        </div>



        <!-- ARTWORK 10 -->

        <div class="artwork"
             data-title="My Paternal Family"
             data-artist="Photograph, 1 Jan 2026"
             data-description="I included my paternal family because they represent another important part of my family history and the relationships I have developed over time. They reflect a different set of experiences and memories that contribute to who I am.">

            <img src="images/artwork10.png" alt="My Paternal Family">

            <h2>
                My Paternal Family
            </h2>

        </div>



        <!-- ARTWORK 11 -->

        <div class="artwork"
             data-title="Just the Three of Us"
             data-artist="Photograph, 11 Mar 2026"
             data-description="I included this artwork because Daniel and Kristian are two of my closest friends and an important part of my life. We have shared many experiences and memories together, and our friendship has become an important part of my everyday life. This artwork represents the time we spend together and the connection we have as friends.">

            <img src="images/artwork11.png" alt="Just the Three of Us">

            <h2>
                Just the Three of Us
            </h2>

        </div>


    </main>



    <!-- =========================
         ARTWORK POPUP
         ========================= -->

    <div id="artworkPopup" class="popup">

        <div class="popup-content">

            <!-- CLOSE BUTTON -->

            <button id="closeButton" class="close-button">
                ×
            </button>


            <!-- LARGE IMAGE -->

            <div class="popup-image-container">

                <img id="popupImage" src="" alt="">

            </div>


            <!-- INFORMATION -->

            <div class="popup-information">

                <h2 id="popupTitle"></h2>

                <p id="popupArtist" class="popup-artist"></p>

                <div class="popup-line"></div>

                <p id="popupDescription"></p>

            </div>

        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script src="script.js"></script>


</body>

</html>
