    <!-- =========================
         FUTURE GALLERY
         ========================= -->

    <main class="gallery">


        <!-- FUTURE 1 -->

        <div class="artwork"
             data-title="Architecture"
             data-artist="Career"
             data-description="I want to become an architect because it combines my interests in art and mathematics with my desire to create things that have a real impact on the world. I enjoy being creative and designing things, but I also enjoy problem-solving and working with numbers. Architecture would allow me to use both of these skills to design buildings and spaces that people can actually use and experience. I have always wanted to be someone who contributes to building and shaping the world around me, and becoming an architect would give me the opportunity to turn my ideas into something real.">

            <img src="images/arch.png" alt="Future One">

            <h2>
                Architecture
            </h2>

        </div>



        <!-- FUTURE 2 -->

        <div class="artwork"
             data-title="Adelaide University"
             data-artist="Education"
             data-description="I would like to attend the University of Adelaide because it would give me the opportunity to study a field I am genuinely interested in while preparing me for a career in architecture. I like the idea of studying in a university environment where I can develop my creativity, problem-solving and mathematical skills and apply them to real projects. Studying in Adelaide would also allow me to stay close to my family and the people I know while still experiencing the independence of university life. I see it as a place where I could develop the skills and knowledge I need to work towards becoming an architect.">

            <img src="images/uni.png" alt="Future Two">

            <h2>
                Adelaide University
            </h2>

        </div>



        <!-- FUTURE 3 -->

        <div class="artwork"
             data-title="Rural Germany"
             data-artist="Place"
             data-description="I would like to visit rural Germany because I have recently become interested in what life is like in rural areas and enjoy the idea of experiencing a quieter and less crowded environment. Germany also interests me because of its countryside, small towns and different way of life compared to where I live. Inisha has also told me that she would love to see Germany, which has made the idea of visiting it even more appealing to me. I would like to experience the country for myself while also sharing the experience with someone who has always wanted to go there.">

            <img src="images/germany.png" alt="Future Three">

            <h2>
                Rural Germany
            </h2>

        </div>



        <!-- FUTURE 4 -->

        <div class="artwork"
             data-title="Skydiving"
             data-artist="Experience"
             data-description="I would like to go skydiving because I want to experience something completely different from anything I have done before. The idea of jumping from a plane and seeing the world from such a different perspective is exciting to me. I also think it would be a good way to challenge myself and step outside of my comfort zone. Skydiving would be an experience I could look back on and remember for a long time, which is why it is something I would like to try in the future.">

            <img src="images/skydive.png" alt="Future Four">

            <h2>
                Skydiving
            </h2>

        </div>



        <!-- FUTURE 5 -->

        <div class="artwork"
             data-title="Anthony Edwards Stark"
             data-artist="Fictional Idol"
             data-description="I would want to be like Tony Stark, especially played by Robert Downey Jr., because I relate to his creativity, intelligence and personality. I admire how he is able to come up with new ideas and use his knowledge to create and solve problems. I also think we share a similar sense of humour, as I can be quite witty and tend to use humour in a lot of situations. While I obviously would not want to copy everything about him, I like the way he combines creativity, confidence and humour to approach different situations. These are qualities that I would like to develop in myself. He's also jacked. Respect.">

            <img src="images/tony.png" alt="Future Five">

            <h2>
                Tony Stark - (MCU)
            </h2>

        </div>



        <!-- FUTURE 6 -->

        <div class="artwork"
             data-title="Levi Stoici"
             data-artist="Future Me"
             data-description="The person I want to become is someone who is successful, independent and able to make a positive impact on the people around me. I want to have a career that I enjoy and that allows me to provide for and spoil my family while still having time to enjoy life. I want to be creative and ambitious, but also stay grounded and remember the people who helped me get where I am. I also want to be someone who has a strong circle of friends and is always there for the people I care about. I want to be confident in who I am, willing to speak my mind and open to seeing things from different perspectives. At the same time, I want to have an adventurous side and make the most of life by trying new things, travelling and creating memories that I can look back on. Overall, I want to become someone who works hard for what they want without letting success change who they are. I want to build a life that I am proud of, while being a good friend, family member and person along the way.">

            <img src="images/levi.png" alt="Future Five">

            <h2>
                Levi
            </h2>

        </div>


    </main>
